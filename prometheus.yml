global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'demo-app'
    static_configs:
      - targets: ['demo-app-staging:3000']
    metrics_path: '/health'
    scrape_interval: 10s

  - job_name: 'nginx'
    static_configs:
      - targets: ['demo-app-prod-nginx:80']
    metrics_path: '/'
    scrape_interval: 15s

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
