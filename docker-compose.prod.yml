version: '3.8'

services:
  blue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demo-app-blue
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_VERSION=v1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  green:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demo-app-green
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_VERSION=v2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nginx-prod:
    image: nginx:alpine
    container_name: demo-app-prod-nginx
    ports:
      - "9090:80"
    volumes:
      - ./nginx-blue.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      blue:
        condition: service_healthy
    restart: unless-stopped
